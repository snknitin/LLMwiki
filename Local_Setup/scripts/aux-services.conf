# Editable allow-list for aux-services.
#
# Entries are listed in START order. `stop` stops them in reverse order;
# `start` restores only the entries that were active before `stop`, in this order.
# Supported forms:
#   user-service|UNIT|CONTROL_NAME|PORTS|POLICY
#   user-timer|UNIT|CONTROL_NAME|PORTS|POLICY
#   system-service|UNIT|CONTROL_NAME|PORTS|POLICY
#   system-timer|UNIT|CONTROL_NAME|PORTS|POLICY
#   docker|CONTAINER|CONTROL_NAME|PORTS|POLICY
#   frontier|OWNER|CONTROL_NAME|PORTS|POLICY
#   compose|DISPLAY_NAME|WORKING_DIRECTORY|FILE1,FILE2|SERVICE|CONTROL_NAME|PORTS|POLICY
# POLICY is managed (bulk + named), protected (named only), or locked (inventory only).
#
# Keep this file mode 600. It is sourced as shell syntax, so only the operator
# should edit it. Do not add spark-model, LM Studio, vLLM/model containers,
# spark-litellm, hermes-gateway, hermes-serve, or glm-reasoning-shim here.
# Those belong to the model/control-plane managers, not the optional extras.

START_SETTLE_SECONDS=3

EXTRA_ITEMS=(
  'user-service|obsidian-sync-llmwiki.service|obsidian-llmwiki-sync|-|managed'
  'user-service|obsidian-sync-personal.service|obsidian-personal-sync|-|managed'
  'user-service|dunbar-dossier.service|dunbar-dossier|8766/10000|managed'
  'user-service|social-capture.service|signal-desk|8765|managed'
  'user-service|opencode-web.service|opencode-web|3003|managed'
  'user-service|hermes-dashboard.service|hermes-dashboard|9120|managed'
  'user-service|hermes-html-viewer.service|hermes-html-viewer|8446|managed'
  'user-service|youtube-learning-center.service|youtube-learning-center|8443|managed'
  "compose|sparkDash|$HOME/src/frontier/sparkDash|docker-compose.yml,docker-compose.local.yml|sparkdash|sparkdash|5555|managed"
  'user-service|hermes-gateway.service|hermes-gateway|-|protected'
  'user-service|hermes-serve.service|hermes-serve|9119|protected'
  'user-service|glm-reasoning-shim.service|glm-reasoning-shim|8101|protected'
  'docker|spark-litellm|spark-litellm|4000|protected'
  'frontier|spark-frontier|frontier-api|8100,29521|locked'
  'docker|vllm-fn-nfs|frontier-nfs|111,2049|locked'
  'system-service|tailscaled.service|tailscale-serve|443->27910,27913,27914,27915,27918,27919;8443;8765;10000|locked'
  'system-service|ssh.service|spark-ssh|22|locked'
)
